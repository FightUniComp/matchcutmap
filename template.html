<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auteur Atlas</title>
<link rel="icon" href="__FAVICON__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a dark reading room. The map fills the left, a reference panel sits right. One theme by choice. */
:root{
  color-scheme: dark;
  --bg:#121318; --surface:#1a1c23; --raised:#23262f; --line:#323644;
  --ink:#ece8df; --muted:#9d9ead; --accent:#e9b44c; --ok:#8fd19e;
  --era0:#b9c2cf; --era1:#e8926d; --era2:#9fd08c; --era3:#cba2e6; --era4:#7cc7e8;
  --in:#6fd3c7; --out:#e9b44c;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin-right:auto;min-width:0}
.brand h1{margin:0;line-height:0}
.brand img{height:30px;width:auto;display:block}
.brand p{margin:0;color:var(--muted);font-size:11.5px;white-space:nowrap}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls input[type=search],.controls select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.controls input[type=search]{width:160px}
.controls select{width:132px}
.toggle{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);margin:0}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.btn:hover,.toggle:hover{border-color:var(--muted)}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px}
.stage{position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column}
svg#map{width:100%;flex:1;min-height:0;display:block;cursor:grab;touch-action:none}
svg#map.dragging{cursor:grabbing}
.techbar{position:absolute;left:12px;right:12px;top:12px;background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:8px 12px;display:flex;gap:12px;align-items:flex-start}
.techbar[hidden]{display:none}
.techbar p{margin:0;flex:1}
.legend{border-top:1px solid var(--line);background:var(--surface);padding:8px 64px 8px 16px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.legend b{color:var(--ink);font-weight:600}
.legend ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px}
.legend li{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.zoom{position:absolute;right:12px;bottom:64px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:36px;height:36px;padding:0;font-size:18px;line-height:1}

.node circle{stroke:var(--bg);stroke-width:2;transition:opacity .15s}
.node text{fill:var(--ink);font-size:var(--fs,13px);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:.3em;stroke-linejoin:round;pointer-events:none;transition:opacity .15s}
.node{cursor:pointer}
.node:hover circle{stroke:var(--ink)}
.node:hover text{display:block!important}
.node.sel circle{stroke:var(--ink);stroke-width:4}
.node.sel text{font-weight:600}
.node.dim circle{opacity:.3}
.node.dim text{opacity:.4}
svg.far .node.t2:not(.sel):not(.rel) text,svg.far .node.t3:not(.sel):not(.rel) text,svg.mid .node.t3:not(.sel):not(.rel) text{display:none}
svg.crowd.far .node.rel.t2:not(.sel) text,svg.crowd.far .node.rel.t3:not(.sel) text,svg.crowd.mid .node.rel.t3:not(.sel) text{display:none}
.slink{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-opacity:.2}
.slink.hot{stroke:var(--ink);stroke-opacity:.85;stroke-width:2.4;stroke-dasharray:6 6}
.slink.dim{stroke-opacity:.04}
.ilink{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-opacity:.16}
.ilink.in{stroke:var(--in);stroke-opacity:.95;stroke-width:2.6}
.ilink.out{stroke:var(--out);stroke-opacity:.95;stroke-width:2.6}
.ilink.dim{stroke-opacity:.03}
.iarr{fill:var(--muted);fill-opacity:.16}
.iarr.in{fill:var(--in);fill-opacity:.95}
.iarr.out{fill:var(--out);fill-opacity:.95}
.iarr.dim{fill-opacity:.03}
.off{display:none}
.hull{cursor:pointer}
.hull path{fill:var(--accent);fill-opacity:.065;transition:fill-opacity .2s}
.hull.cat path{fill:var(--ink);fill-opacity:.04}
.hull text{fill:var(--accent);font-size:var(--hfs,13px);font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-anchor:middle;opacity:.85;paint-order:stroke;stroke:var(--bg);stroke-width:.35em;stroke-linejoin:round}
.hull.cat text{fill:var(--muted)}
svg.far .hull.small text{display:none}
.hull:hover path{fill-opacity:.12}
.hull.on path{fill-opacity:.17}
.hull.dim path{fill-opacity:.023}
.hull.cat.dim path{fill-opacity:.014}
.hull.dim text{opacity:.3}

aside{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:18px 18px 28px}
aside h2{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.12;margin:0 0 4px;text-wrap:balance}
aside .meta{color:var(--muted);margin:0 0 6px}
aside h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:22px 0 8px;display:flex;gap:8px;align-items:baseline}
aside h3 small{font-size:10.5px;letter-spacing:.04em;text-transform:none;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:0 7px}
aside h3 small.ok{color:var(--ok);border-color:var(--ok)}
aside ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank{margin:0 0 12px;color:var(--muted);font-size:13px}
.rank b{color:var(--accent);font-family:var(--display);font-size:18px;font-weight:800;margin-right:2px}
.rank a{color:var(--muted)}
.sig{font-size:15.5px;line-height:1.45;margin:0 0 8px;font-weight:500}
.desc{margin:0;color:var(--ink);opacity:.9}
aside ul.facts{gap:7px}
.facts li{position:relative;padding-left:15px}
.facts li::before{content:"";position:absolute;left:1px;top:.58em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.facts.ok li::before,.facts li.ok::before{background:var(--ok)}
aside ul.films{gap:8px}
.film{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
.film .ft{font-weight:600}
.film .fy{color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.film .bd{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.film .b{font-size:11.5px;border-radius:4px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.film .b.ts{color:var(--accent);border-color:var(--accent)}
.fg{margin:10px 0 4px}.fg summary{cursor:pointer;color:var(--muted);font-size:13px}.fg summary small{opacity:.8}
.fg ol{list-style:none;padding:0;margin:8px 0 0;columns:2;column-gap:18px;font-size:13px;line-height:1.5}
.fg li{break-inside:avoid;display:flex;align-items:baseline}.fg .fn{flex:1;min-width:0;overflow-wrap:anywhere}
.fg ol.one{columns:1}.fg ol.one .fr{min-width:30px;text-align:right}.fg ol.one .fr.im{min-width:62px}
.fg .fr{margin-left:8px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.fgsort{display:flex;gap:6px;align-items:center;margin:8px 0 0;font-size:12px;color:var(--muted)}
.fgsort button,.lnk{font:inherit;cursor:pointer}
.fgsort button{padding:1px 9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.fgsort button[aria-pressed="true"]{color:var(--ink);border-color:var(--muted)}
.lnk{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.b.rt small,.b.im small{opacity:.75;font-size:inherit}
.film .b.im{color:var(--ink);border-color:var(--muted)}
.film .b.me{color:var(--ok);border-color:var(--ok)}
.fg .fr.im{color:var(--ink)}
.mine-box .note,.note{font-size:12.5px;color:var(--muted);margin:6px 0 0;line-height:1.45}
.importmsg{font-size:13px;color:var(--ok);margin:8px 0 0}
@media (max-width:1430px){.brand p{display:none}}
@media (max-width:1400px){.controls{gap:6px}.controls select{width:116px}.controls input[type=search]{width:140px}.toggle,.btn{padding-left:8px;padding-right:8px}}.fg .fy{display:inline-block;width:38px;color:var(--muted)}.fg a{color:var(--ink);text-decoration:none}.fg a:hover{color:var(--accent);text-decoration:underline}
.film .b.ca{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:600}
.film .b.ss{color:var(--in);border-color:var(--in)}
.film .ov{margin:7px 0 0;font-size:13px;color:var(--ink);opacity:.85}
.film .fl{display:flex;gap:12px;margin-top:7px;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--accent);color:var(--accent)}
.bar{display:grid;grid-template-columns:1fr;gap:3px;margin-bottom:9px}
.bar .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.bar .track{position:relative;height:6px;background:var(--raised);border-radius:3px}
.bar .pin{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.person{display:block;width:100%;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
.person:hover{border-color:var(--muted)}
.person b{font-weight:600}
.person small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.person small.ev{color:var(--ok)}
.tagin{color:var(--in)} .tagout{color:var(--out)}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.note{margin-top:22px;padding:10px 12px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:12.5px}
.src li{font-size:13px}
.src b{font-weight:600}
.src span{color:var(--muted)}

@media (max-width:900px){
  body{height:auto}
  main{display:block}
  .stage{height:70vh;min-height:380px}
  aside{border-left:0;border-top:1px solid var(--line)}
  .brand p{display:none}
}
.trace{fill:none;stroke:var(--accent);stroke-width:4.5;stroke-linecap:round;stroke-opacity:.95}
.trace.sty{stroke-dasharray:10 9}
.trace-h{fill:var(--accent)}
.node.end circle{stroke:var(--accent);stroke-width:4}
.trace-box{border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin:14px 0 6px;background:rgba(233,180,76,.06)}
.trace-box h3{margin-top:0}
.chain{list-style:none;padding:0;margin:0 0 10px}
.chain li{margin:0}
.chain .how{display:block;color:var(--muted);font-size:12.5px;margin:2px 0 2px 14px;padding-left:10px;border-left:2px solid var(--accent)}
.person.mini{padding:4px 8px}
.tracer{display:flex;gap:6px;flex-wrap:wrap}
.tracer input{flex:1 1 140px;min-width:0}
.awards{list-style:none;padding:0;margin:0}
.awards li{padding:5px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.awards small{color:var(--muted);flex-basis:100%}
.crole{margin:6px 0;line-height:1.5}
.crole>span{display:inline-block;min-width:118px;color:var(--muted);font-size:12.5px}
.crole a{color:var(--ink)}
small.wd{color:var(--ok)}
a.chip{text-decoration:none;color:var(--ink)}
[hidden]{display:none!important}
svg:not(.tl) #gAxis{display:none}
svg.tl #gHull,svg.tl #gStyle,svg.tl #gCrew{display:none}
svg.morphing #gStyle,svg.morphing #gInf,svg.morphing #gTrace,svg.morphing #gHull,svg.morphing #gCrew{display:none}
.axis line{stroke:var(--line);stroke-width:2}
.axis text{fill:var(--muted);font-size:var(--hfs,13px);text-anchor:middle}
.lane rect{fill:var(--ink);fill-opacity:.03}
.lane text{fill:var(--accent);font-size:var(--hfs,13px);font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-anchor:end;dominant-baseline:middle;opacity:.85}
.crew{fill:none;stroke:var(--in);stroke-width:1.6;stroke-opacity:.32;stroke-dasharray:4 5}
.crew.hot{stroke-opacity:.9;stroke-width:2.6}
.crew.dim{stroke-opacity:.04}
.node.seen circle{stroke:var(--ok);stroke-width:3.2}
.film{position:relative}
.seenbtn,.wantbtn{font:inherit;font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.seenbtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--bg);font-weight:600}
.wantbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.film .fa{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fg .wm,.wl .wm,ol.hl .wm{width:13px;height:15px;padding:0;margin:0 7px -2px 0;background:none;border:0;cursor:pointer;vertical-align:baseline;flex:none}
.fg .wm svg,.wl .wm svg,ol.hl .wm svg{width:11px;height:13px;fill:none;stroke:var(--muted);stroke-width:1.3}
.fg .wm[aria-pressed="true"] svg,.wl .wm[aria-pressed="true"] svg,ol.hl .wm[aria-pressed="true"] svg{fill:var(--accent);stroke:var(--accent)}
.wl{list-style:none;padding:0;margin:8px 0 0;font-size:13px;line-height:1.5;display:flex;flex-direction:column;gap:3px}
.wl li{display:flex;align-items:baseline}.wl .fy{display:inline-block;width:38px;color:var(--muted);flex:none}.wl .fn{flex:1;min-width:0}
.wl .fr{margin-left:8px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.wl .sm{flex:none}
.tabs{display:flex;gap:6px;margin:12px 0 2px}
.tabs button{font:inherit;font-size:12.5px;padding:3px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--muted)}
#gBand .band{fill:var(--accent);fill-opacity:.075}
#gBand .bandlab{fill:var(--accent);font-size:var(--hfs,13px);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
#gBand .career{stroke:var(--ink);stroke-width:3px;stroke-linecap:round;opacity:.5;vector-effect:non-scaling-stroke}
#gBand .ctick{stroke:var(--ink);stroke-width:1.5px;opacity:.75;vector-effect:non-scaling-stroke}
#gBand .ctick.key{stroke:var(--accent);stroke-width:2.5px;opacity:1}
#gBand .cyear{fill:var(--ink);font-size:var(--hfs,13px);font-variant-numeric:tabular-nums;dominant-baseline:middle}
svg:not(.tl) #gBand,svg.morphing #gBand{display:none}
.axis text.dec{cursor:pointer;pointer-events:all}
.axis text.dec:hover{fill:var(--ink)}
.axis text.dec.on{fill:var(--accent);font-weight:700}
.cchart{position:relative;margin:2px 0 4px}
.cchart svg{width:100%;height:auto;display:block;overflow:visible}
.cchart .cg{stroke:var(--line);stroke-width:1}
.cchart .ct{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
.cchart .hit{fill:transparent}
.cchart .dot{fill:var(--muted);stroke:var(--surface);stroke-width:2}
.cchart .key .dot{fill:var(--accent)}
.cchart .seen .dot{stroke:var(--ok)}
.cchart .cpt{outline:none}
.cchart .cpt:hover .dot,.cchart .cpt:focus-visible .dot{stroke:var(--ink)}
.cchart .clab{fill:var(--ink);font-size:11px}
.ctip{position:absolute;pointer-events:none;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;white-space:nowrap;transform:translate(-50%,calc(-100% - 8px));z-index:2}
.ctip b{font-size:13px;margin-right:6px;font-variant-numeric:tabular-nums}
.ckey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:4px}
.ckey i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.ckey .k1{background:var(--accent)}.ckey .k2{background:var(--muted)}.ckey .k3{border:2px solid var(--ok);width:6px;height:6px}
ol.decfilms{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px;font-size:13px}
ol.decfilms li{display:flex;align-items:baseline;gap:6px}ol.decfilms .fy{color:var(--muted);width:34px;flex:none;font-variant-numeric:tabular-nums}
ol.decfilms .fn{flex:1;min-width:0}ol.decfilms .fr{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.more{color:var(--muted);font-size:12.5px;padding-left:4px}
button.b{font:inherit;font-size:11.5px;background:transparent;cursor:pointer}
button.b:hover{color:var(--ink);border-color:var(--ink)}
.film .b.hn{color:var(--ink);border-color:var(--accent)}
.fg .fh{color:var(--accent);margin-left:5px;font-size:9px;cursor:help}
ol.hl{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.45}
ol.hl li{display:flex;align-items:baseline}ol.hl .fy{display:inline-block;min-width:58px;padding-right:6px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
ol.hl .fn{flex:1;min-width:0}ol.hl .sm,ol.hl .wm{flex:none}ol.hl .sp{display:inline-block;width:40px;flex:none}ol.hl .sm,ol.hl .wm{margin-right:7px}
ol.hl .yr{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}ol.hl .off{color:var(--muted);font-size:12px}
ol.hl .lnk{font-size:12.5px}
.hgroup{margin:4px 0 2px;font-size:12px;color:var(--muted)}
.progress li button{font:inherit;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--line)}
.fg .sm,.wl .sm,ol.hl .sm{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;padding:0;margin:0 7px -2px 0;cursor:pointer;vertical-align:baseline}
.fg .sm[aria-pressed="true"],.wl .sm[aria-pressed="true"],ol.hl .sm[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.track .pin.b{background:var(--in)}
.vs{color:var(--muted);font-weight:400}
.keyrow{display:flex;gap:14px;margin:4px 0 10px;font-size:12.5px;color:var(--muted)}
.keyrow i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.mine-box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:14px 0 6px}
@keyframes panelIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#panel.enter>*{animation:panelIn .22s ease-out both}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1><img src="__LOGO__" alt="Auteur Atlas"></h1>
    <p>Trace the influences that connect film directors.</p>
  </div>
  <div class="controls">
    <input type="search" id="search" list="names" placeholder="Find a director" aria-label="Find a director">
    <datalist id="names"></datalist>
    <select id="mov" aria-label="Highlight a movement"><option value="">Movements</option></select>
    <select id="tech" aria-label="Highlight a technique"><option value="">Techniques</option></select>
    <select id="geo" aria-label="Highlight a region or country"><option value="">Regions</option></select>
    <label class="toggle"><input type="checkbox" id="showStyle" checked> Style links</label>
    <label class="toggle"><input type="checkbox" id="showInf" checked> Influence</label>
    <label class="toggle" id="crewToggle" hidden><input type="checkbox" id="showCrew"> Crew</label>
    <button class="btn" id="reset" type="button">Whole map</button>
    <button class="btn" id="surprise" type="button" title="Jump to a random director">Surprise me</button>
    <button class="btn" id="viewbtn" type="button" title="Switch between the style map and a timeline">Timeline</button>
  </div>
</header>
<main>
  <div class="stage">
    <svg id="map" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of film directors positioned by stylistic similarity">
      <g id="world"><g id="gAxis"></g><g id="gBand"></g><g id="gHull"></g><g id="gStyle"></g><g id="gCrew"></g><g id="gInf"></g><g id="gTrace"></g><g id="gNodes"></g></g>
    </svg>
    <div class="techbar" id="techbar" hidden><p id="techtext"></p><button class="btn" id="techclear" type="button">Clear</button></div>
    <div class="legend">
      <b>Closer together: more similar style.</b>
      <ul id="eras"></ul>
      <span id="legendText">Colour: the median year of their films. Shaded areas: movements. Bigger circle: influenced more directors here. Arrows run from influence to influenced.</span>
    </div>
    <div class="zoom">
      <button class="btn" id="zin" type="button" aria-label="Zoom in">+</button>
      <button class="btn" id="zout" type="button" aria-label="Zoom out">&minus;</button>
    </div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script>
const DATA = __DATA__;
const NS = "http://www.w3.org/2000/svg";
const byId = {}; DATA.directors.forEach(d => { byId[d.id] = d; d.cx = d.x; d.cy = d.y; d.cr = d.r; });
const dirById = {}; DATA.directory.forEach(d => dirById[d.id] = d);
const T = DATA.techniques, MV = DATA.movements;
const ERA = ["var(--era0)","var(--era1)","var(--era2)","var(--era3)","var(--era4)"];
const state = {sel: null, dir: "", tech: "", mov: "", geo: "", path: null, cmp: null, mine: false, lin: null, lg: 2, dec: 0, hon: "", view: "map", k: 1, x: 0, y: 0};
const clearAll = () => Object.assign(state, {sel: null, dir: "", tech: "", mov: "", geo: "", path: null, cmp: null, mine: false, lin: null, dec: 0, hon: ""});
/* lists and awards: which directors are on a list */
const honCache = {};
const honDirs = k => honCache[k] || (honCache[k] = new Set(DATA.lists[k].e.flatMap(x => x[3])));
const LIST_ORDER = ["cannes", "oscar-picture", "oscar-director", "oscar-international", "tspdt-films", "tspdt-directors", "sight-and-sound", "cahiers-100", "cahiers-annual", "cahiers-decades", "house-of-tabula"].filter(k => DATA.lists[k]);
/* films marked as seen: kept in this browser only */
const stored = k => { try { return JSON.parse(localStorage.getItem("auteurAtlas." + k) || "{}") || {}; } catch (e) { return {}; } };
const SEEN = stored("seen"), MYR = stored("mine"), IMR = stored("imdb"), WANT = stored("want");
let wantVer = 0, wantCache = {v: -1};
function saveWant(){ wantVer++; try { localStorage.setItem("auteurAtlas.want", JSON.stringify(WANT)); return true; } catch (e) { return false; } }
function wantDirs(){ if (wantCache.v === wantVer) return wantCache.ids;
  const ids = new Set(); DATA.directors.forEach(d => { if (d.films.some(f => WANT[fkey(f)]) || (d.fg || []).some(x => WANT[gkey(x)])) ids.add(d.id); });
  wantCache = {v: wantVer, ids}; return ids; }
let FINFO = null;
function filmInfo(){ if (FINFO) return FINFO; FINFO = {};
  DATA.directors.forEach(d => { d.films.forEach(f => { const k = fkey(f); if (!FINFO[k]) FINFO[k] = {t: f.t, y: f.y, d: d.id, r: f.r}; });
    (d.fg || []).forEach(x => { const k = gkey(x); if (!FINFO[k]) FINFO[k] = {t: x[1], y: x[0], d: d.id, r: x[3]}; }); });
  return FINFO; }
const BOOKMARK = '<svg viewBox="0 0 10 12" aria-hidden="true"><path d="M1.5 1h7v10L5 8.2 1.5 11z"/></svg>';
/* influence lineage: who came before and after, generation by generation */
const INB = {}, OUTB = {}, EDGE = {};
DATA.influence.forEach((l, i) => { (INB[l.t] = INB[l.t] || []).push(i); (OUTB[l.s] = OUTB[l.s] || []).push(i); EDGE[l.s + ">" + l.t] = l; });
function lineage(id, gens){
  const walk = down => { const lev = new Map([[id, 0]]), via = {}, edges = new Set(); let fr = [id];
    for (let g = 1; g <= gens && fr.length; g++) { const nx = [];
      fr.forEach(x => ((down ? OUTB : INB)[x] || []).forEach(i => { const l = DATA.influence[i], o = down ? l.t : l.s; edges.add(i);
        if (!lev.has(o)) { lev.set(o, g); via[o] = x; nx.push(o); } }));
      fr = nx; }
    lev.delete(id); return {lev, via, edges}; };
  return {up: walk(false), down: walk(true)};
}
/* the years a director made films in, and who was at work in a decade */
function filmYears(d){ if (!d._ys) d._ys = [...new Set((d.fg || []).map(x => x[0]).concat(d.films.map(f => f.y)).filter(Boolean))].sort((a, b) => a - b); return d._ys; }
const activeIn = (d, dec) => filmYears(d).some(y => y >= dec && y < dec + 10);
let decCache = {};
const decActive = dec => decCache[dec] || (decCache[dec] = new Set(DATA.directors.filter(d => activeIn(d, dec)).map(d => d.id)));
const tlx = y => DATA.timeline.x0 + (y - DATA.timeline.y0) / (DATA.timeline.y1 - DATA.timeline.y0) * (DATA.timeline.x1 - DATA.timeline.x0);   /* films seen, your own ratings, IMDb ratings from your own files */
let seenVer = 0, seenCache = {v: -1};
function saveSeen(){ seenVer++; try { localStorage.setItem("auteurAtlas.seen", JSON.stringify(SEEN)); return true; } catch (e) { return false; } }
function saveImports(){ try { localStorage.setItem("auteurAtlas.mine", JSON.stringify(MYR)); localStorage.setItem("auteurAtlas.imdb", JSON.stringify(IMR)); return true; } catch (e) { return false; } }
const myText = m => m[1] === 5 ? "★".repeat(Math.floor(m[0])) + (m[0] % 1 ? "½" : "") : m[0] + "/10";
const fkey = f => f.tid ? "m" + f.tid : "t" + norm(f.t) + "|" + (f.y || "");
const gkey = x => x[2] ? "m" + x[2] : "t" + norm(x[1]) + "|" + x[0];
function seenStats(d){ const ks = new Set(d.films.map(fkey).concat((d.fg || []).map(gkey))); let n = 0; ks.forEach(k => { if (SEEN[k]) n++; }); return [n, ks.size]; }
function seenInfo(){ if (seenCache.v === seenVer) return seenCache;
  const counts = {}; DATA.directors.forEach(d => { const n = seenStats(d)[0]; if (n) counts[d.id] = n; });
  return seenCache = {v: seenVer, counts, ids: new Set(Object.keys(counts)), recs: null}; }
const seenDirs = () => seenInfo().ids;
/* what to watch next: unseen directors close in style to the ones you have seen, or linked to them by influence */
function suggestions(){
  const S = seenInfo(); if (S.recs) return S.recs;
  const seen = Object.keys(S.counts).map(id => [byId[id], S.counts[id]]), nb = {};
  DATA.influence.forEach(l => { (nb[l.s] = nb[l.s] || new Set()).add(l.t); (nb[l.t] = nb[l.t] || new Set()).add(l.s); });
  const out = [];
  if (seen.length) DATA.directors.forEach(d => { if (S.ids.has(d.id) || !d.films.length) return;
    const v = seen.map(([s, n]) => { const link = nb[s.id] && nb[s.id].has(d.id);
      return [similarity(s, d) / 100 * (0.85 + 0.15 * Math.min(n, 4) / 4) + (link ? 0.2 : 0), s, link]; }).sort((a, b) => b[0] - a[0]);
    const score = v[0][0] + 0.5 * (v[1] ? v[1][0] : 0) + 0.25 * (v[2] ? v[2][0] : 0);
    const near = v.slice(0, 2).filter((x, j) => j === 0 || x[0] > 0.3).map(x => x[1].name), f = d.films[0];
    const link = v.find(x => x[2] && x[0] >= v[0][0] - 0.1);
    out.push({d, score, anchor: (link || v[0])[1].id, why: (link ? "Linked by influence to " + link[1].name : "Close in style to " + near.join(" and ")) + ". Start with " + f.t + (f.y ? " (" + f.y + ")" : "") + "." }); });
  out.sort((a, b) => b.score - a.score || b.d.r - a.d.r);
  const picked = [], per = {}, pool = out.slice(0, 200);   // spread the picks over the directors you have seen
  while (picked.length < 10 && pool.length) { let bi = 0, bv = -1;
    pool.forEach((r, j) => { const v = r.score * Math.pow(0.8, per[r.anchor] || 0); if (v > bv) { bv = v; bi = j; } });
    const r = pool.splice(bi, 1)[0]; picked.push(r); per[r.anchor] = (per[r.anchor] || 0) + 1; }
  return S.recs = picked;
}
const firstCountry = d => d.country.split("/")[0].trim();
const geoOk = d => !state.geo || (state.geo.startsWith("c:") ? firstCountry(d) === state.geo.slice(2) : d.region === state.geo.slice(2));
const $ = id => document.getElementById(id);
const svg = $("map"), world = $("world");
const CX = DATA.w/2, CY = DATA.h/2;
svg.setAttribute("viewBox", "0 0 " + DATA.w + " " + DATA.h);
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const a in attrs) e.setAttribute(a, attrs[a]); if (parent) parent.appendChild(e); return e; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
DATA.eras.forEach((lab, i) => { const li = document.createElement("li"); li.innerHTML = '<span class="dot" style="background:' + ERA[i] + '"></span>' + esc(lab); $("eras").appendChild(li); });

/* ---------- movement areas ---------- */
function hull(pts){
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (pts.length < 3) return pts;
  const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = []; for (const p of pts) { while (lo.length >= 2 && cross(lo[lo.length-2], lo[lo.length-1], p) <= 0) lo.pop(); lo.push(p); }
  const up = []; for (const p of pts.slice().reverse()) { while (up.length >= 2 && cross(up[up.length-2], up[up.length-1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
const hullEls = Object.keys(MV).filter(k => MV[k].primary.length >= 2).map(k => {
  const m = MV[k], pts = m.primary.map(id => [byId[id].x, byId[id].y]), h = hull(pts);
  const g = el("g", {class:"hull", tabindex:"0", role:"button", "aria-label":m.name}, $("gHull"));
  el("path", {d: roundedHull(h, 60)}, g);
  const top = Math.min.apply(null, pts.map(p => p[1])), cx = pts.reduce((a, p) => a + p[0], 0) / pts.length;
  const t = el("text", {x:cx, y:top - 70}, g); t.textContent = m.name;
  g.addEventListener("click", () => { if (!moved) setMov(k); });
  g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); setMov(k); } });
  return {k, e: g, small: m.primary.length < 5};
});
function roundedHull(h, r){
  /* the convex hull grown by r with round corners: straight edges plus arcs, drawn as a plain fill */
  const f = v => Math.round(v * 10) / 10;
  let A = 0; h.forEach((p, i) => { const q = h[(i + 1) % h.length]; A += p[0]*q[1] - q[0]*p[1]; });
  const s = A < 0 ? -1 : 1, sweep = A < 0 ? 0 : 1;
  const n = h.map((p, i) => { const q = h[(i + 1) % h.length], dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1; return [s*dy/L, -s*dx/L]; });
  let d = "M" + f(h[0][0] + r*n[0][0]) + "," + f(h[0][1] + r*n[0][1]);
  h.forEach((p, i) => { const j = (i + 1) % h.length, q = h[j];
    d += "L" + f(q[0] + r*n[i][0]) + "," + f(q[1] + r*n[i][1]) + "A" + r + "," + r + " 0 0," + sweep + " " + f(q[0] + r*n[j][0]) + "," + f(q[1] + r*n[j][1]); });
  return d + "Z";
}
function setMov(k){ const m = state.mov === k ? "" : k; clearAll(); state.mov = m; paint(); }

/* ---------- draw once ---------- */
/* links are drawn as a handful of combined paths, one per look, instead of one element per link: far cheaper to redraw while moving */
const f1 = v => Math.round(v * 10) / 10;
let sGeo = [], iGeo = [], cGeo = [];
function arrowHead(x, y, ux, uy, L){ const bx = x - ux*0.9*L, by = y - uy*0.9*L, h = 0.4*L;
  return "M" + f1(x + ux*0.1*L) + "," + f1(y + uy*0.1*L) + "L" + f1(bx - uy*h) + "," + f1(by + ux*h) + "L" + f1(bx + uy*h) + "," + f1(by - ux*h) + "Z"; }
function buildGeo(){
  const line = (a, b) => "M" + f1(a.cx) + "," + f1(a.cy) + "L" + f1(b.cx) + "," + f1(b.cy);
  sGeo = DATA.style.map(l => line(byId[l.a], byId[l.b]));
  cGeo = DATA.crew.map(c => line(byId[c[0]], byId[c[1]]));
  iGeo = DATA.influence.map(l => { const s = byId[l.s], t = byId[l.t];
    const dx = t.cx - s.cx, dy = t.cy - s.cy, d = Math.hypot(dx, dy) || 1, ux = dx/d, uy = dy/d;
    const x1 = s.cx + ux*s.cr, y1 = s.cy + uy*s.cr, x2 = t.cx - ux*(t.cr+4), y2 = t.cy - uy*(t.cr+4);
    const mx = (x1+x2)/2 - uy*d*0.08, my = (y1+y2)/2 + ux*d*0.08, ex = x2 - mx, ey = y2 - my, e = Math.hypot(ex, ey) || 1;
    return {c: "M" + f1(x1) + "," + f1(y1) + "Q" + f1(mx) + "," + f1(my) + " " + f1(x2) + "," + f1(y2), h9: arrowHead(x2, y2, ex/e, ey/e, 9), h13: arrowHead(x2, y2, ex/e, ey/e, 13)}; });
}
buildGeo();
const CP = {}; [" dim", "", " hot"].forEach(c => CP[c] = el("path", {class: "crew" + c}, $("gCrew")));
const SP = {}; [" dim", "", " hot"].forEach(c => SP[c] = el("path", {class: "slink" + c}, $("gStyle")));
const TR = {line: el("path", {class: "trace"}, $("gTrace")), dash: el("path", {class: "trace sty"}, $("gTrace")), head: el("path", {class: "trace-h"}, $("gTrace"))};
const IP = {}; [" dim", "", " in", " out"].forEach(c => IP[c] = [el("path", {class: "ilink" + c}, $("gInf")), el("path", {class: "iarr" + c}, $("gInf"))]);
const nodeEls = DATA.directors.map(d => {
  const g = el("g", {class:"node", tabindex:"0", role:"button", "aria-label":d.name}, $("gNodes"));
  d.g = g; d.circle = el("circle", {cx:d.x, cy:d.y, r:d.r, fill:ERA[d.era]}, g);
  const t = el("text", {x:d.x, y:d.y + d.r, dy:"1.15em"}, g); t.textContent = d.name; d.label = t;
  g.addEventListener("click", () => { if (!moved) select(d.id); });
  g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(d.id); } });
  return {d, e: g};
});

/* ---------- state to view ---------- */
function related(id){
  const s = new Set([id]);
  DATA.style.forEach(l => { if (l.a === id) s.add(l.b); if (l.b === id) s.add(l.a); });
  DATA.influence.forEach(l => { if (l.s === id) s.add(l.t); if (l.t === id) s.add(l.s); });
  byId[id].near.forEach(n => s.add(n.id));
  return s;
}
function paint(){
  const showS = $("showStyle").checked, showI = $("showInf").checked;
  const onPath = state.path ? new Set([state.path.a, state.path.b].concat(state.path.steps.map(s => s.to))) : null;
  const mine = state.mine ? (state.mine === "want" ? wantDirs() : seenDirs()) : null;
  const lin = state.lin ? lineage(state.lin, state.lg) : null, decSet = state.dec ? decActive(state.dec) : state.hon ? honDirs(state.hon) : null;
  const rel = state.sel && !onPath ? related(state.sel) : null;
  const active = state.tech || state.mov || state.geo || mine || onPath || rel || lin || decSet, quiet = mine || onPath || lin || decSet;
  let lit = 0;
  nodeEls.forEach(({d, e}) => {
    let dim = false;
    if (state.tech) dim = !d.tags.includes(state.tech);
    else if (state.mov) dim = !d.movements.includes(state.mov);
    else if (state.geo) dim = !geoOk(d);
    else if (lin) dim = !(d.id === state.lin || lin.up.lev.has(d.id) || lin.down.lev.has(d.id));
    else if (decSet) dim = !decSet.has(d.id);
    else if (mine) dim = !mine.has(d.id);
    else if (onPath) dim = !onPath.has(d.id);
    else if (rel) dim = !rel.has(d.id);
    if (active && !dim) lit++;
    e.setAttribute("class", "node t" + d.tier + (d.id === state.sel || d.id === state.lin ? " sel" : "") + (state.path && d.id === state.path.b ? " end" : "") + (dim ? " dim" : active ? " rel" : ""));
  });
  svg.classList.toggle("crowd", lit > 60);
  const sb = {" dim": [], "": [], " hot": []};
  if (showS) DATA.style.forEach((l, i) => { let c = "";
    if (state.tech) c = (byId[l.a].tags.includes(state.tech) && byId[l.b].tags.includes(state.tech)) ? "" : " dim";
    else if (state.mov) c = (byId[l.a].movements.includes(state.mov) && byId[l.b].movements.includes(state.mov)) ? "" : " dim";
    else if (state.geo) c = geoOk(byId[l.a]) && geoOk(byId[l.b]) ? "" : " dim";
    else if (onPath || lin || decSet || mine) c = " dim";
    else if (state.sel) c = (l.a === state.sel || l.b === state.sel) ? " hot" : " dim";
    sb[c].push(sGeo[i]); });
  for (const c in SP) SP[c].setAttribute("d", sb[c].join(""));
  const ib = {" dim": [], "": [], " in": [], " out": []};
  if (showI) DATA.influence.forEach((l, i) => { let c = "";
    if (state.tech) c = " dim";
    else if (state.mov) c = (byId[l.s].movements.includes(state.mov) && byId[l.t].movements.includes(state.mov)) ? "" : " dim";
    else if (state.geo) c = geoOk(byId[l.s]) && geoOk(byId[l.t]) ? "" : " dim";
    else if (lin) c = lin.up.edges.has(i) ? " in" : lin.down.edges.has(i) ? " out" : " dim";
    else if (decSet) c = decSet.has(l.s) && decSet.has(l.t) ? "" : " dim";
    else if (onPath || mine) c = " dim";
    else if (state.sel) c = l.t === state.sel ? " in" : l.s === state.sel ? " out" : " dim";
    ib[c].push(i); });
  for (const c in IP) { const big = c === " in" || c === " out";
    IP[c][0].setAttribute("d", ib[c].map(i => iGeo[i].c).join(""));
    IP[c][1].setAttribute("d", ib[c].map(i => big ? iGeo[i].h13 : iGeo[i].h9).join("")); }
  const cb = {" dim": [], "": [], " hot": []};
  if ($("showCrew").checked && state.view === "map") DATA.crew.forEach((c, i) => { let k = "";
    if (state.tech || state.mov || state.geo || quiet) k = " dim";
    else if (state.sel) k = (c[0] === state.sel || c[1] === state.sel) ? " hot" : " dim";
    cb[k].push(cGeo[i]); });
  for (const c in CP) CP[c].setAttribute("d", cb[c].join(""));
  markSeenNodes();
  const tl = [], ts = [], th = [];
  if (onPath) state.path.steps.forEach(s => { if (s.e.k === "i") { tl.push(iGeo[s.e.i].c); th.push(iGeo[s.e.i].h13); }
    else { const a = byId[s.from], b = byId[s.to]; ts.push("M" + f1(a.cx) + "," + f1(a.cy) + "L" + f1(b.cx) + "," + f1(b.cy)); } });
  TR.line.setAttribute("d", tl.join("")); TR.dash.setAttribute("d", ts.join("")); TR.head.setAttribute("d", th.join(""));
  if (state.sel || state.lin) { const n = nodeEls.find(n => n.d.id === (state.sel || state.lin)); n.e.parentNode.appendChild(n.e); }
  drawBands();
  const tb = $("techbar");
  if (state.tech) { const t = T[state.tech]; const c = DATA.directors.filter(d => d.tags.includes(state.tech)).length;
    $("techtext").innerHTML = "<strong>" + esc(t.name) + "</strong> (" + esc(t.cat) + ", " + c + " directors). " + esc(t.def); tb.hidden = false; }
  else tb.hidden = true;
  $("tech").value = state.tech; $("mov").value = state.mov; $("geo").value = state.geo;
  hullEls.forEach(({k, e, small}) => e.setAttribute("class", "hull" + (small ? " small" : "") + (MV[k].kind === "category" ? " cat" : "") + (state.mov === k ? " on" : (state.mov || state.tech || state.geo || quiet) ? " dim" : "")));
  panel();
  syncRoute();
}

/* ---------- side panel ---------- */
function person(id, sub, cls, ev, wd){
  const d = byId[id];
  return '<li><button class="person" type="button" data-go="' + id + '"><b>' + esc(d.name) + '</b>' + (cls ? ' <span class="' + cls + '">&#9679;</span>' : '') +
    (sub ? '<small>' + esc(sub) + '</small>' : '') + (wd ? '<small class="wd">Recorded in Wikidata</small>' : '') +
    (ev ? '<small class="ev">Named together in the Oxford History of World Cinema, scan p. ' + ev.join(", ") + '</small>' : '') + '</button></li>';
}
function stepText(s){
  if (s.e.k === "s") return "similar in style to";
  const l = DATA.influence[s.e.i], fwd = l.s === s.from;
  return (fwd ? "influenced" : "was influenced by") + (l.note ? ". " + l.note : "") + (l.wd ? " (Wikidata)" : "");
}
function traceBox(d){
  const P = state.path;
  if (!P || P.a !== d.id) return "";

  }
  if (wheel) {
    const k = state.k * Math.pow(wheel.k / state.k, 1 - Math.exp(-dt / 70)), r = k / state.k;
    state.x = wheel.px - (wheel.px - state.x)*r; state.y = wheel.py - (wheel.py - state.y)*r; state.k = k;
    if (Math.abs(Math.log(wheel.k / k)) > 0.001) busy = true; else wheel = null;
  }
  if (glide) {
    const f = Math.exp(-dt / 300); glide.vx *= f; glide.vy *= f; state.x += glide.vx*dt; state.y += glide.vy*dt;
    if (Math.hypot(glide.vx, glide.vy) > 0.02) busy = true; else glide = null;
  }
  if (drag && drag.to) { state.x = drag.to[0]; state.y = drag.to[1]; drag.to = null; }
  render();
  if (busy) kick();
  else { last = 0; clearTimeout(settle); settle = setTimeout(() => relabel(true), 80); }
}
function flyTo(cx, cy, k, ms){
  k = clampK(k); wheel = glide = null;
  if (REDUCE) { state.k = k; state.x = CX - cx*k; state.y = CY - cy*k; render(); relabel(true); return; }
  const [x0, y0] = centre(), path = zoomPath([x0, y0, DATA.w / state.k], [cx, cy, DATA.w / k]);
  fly = {path, t0: performance.now(), dur: ms || Math.max(420, Math.min(1200, path.duration * 0.9))};
  last = 0; kick();
}
function centreOn(d, k){ flyTo(d.cx, d.cy, k == null ? state.k : k); }
function zoomAt(px, py, f){ const k = clampK(state.k*f), r = k/state.k; state.x = px - (px - state.x)*r; state.y = py - (py - state.y)*r; state.k = k; render(); relabel(true); }
function svgPoint(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }

svg.addEventListener("wheel", ev => {
  ev.preventDefault(); fly = glide = null;
  const p = svgPoint(ev), dy = ev.deltaY * (ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? 400 : 1);
  const f = Math.exp(-dy * (ev.ctrlKey ? 0.01 : 0.0022));        // ctrlKey: pinch on a trackpad
  wheel = {k: clampK((wheel ? wheel.k : state.k) * f), px: p.x, py: p.y};
  if (REDUCE) { zoomAt(p.x, p.y, wheel.k / state.k); wheel = null; return; }
  kick();
}, {passive: false});

let drag = null, moved = false, pinch = null;
const ptrs = new Map();
svg.addEventListener("pointerdown", ev => {
  ptrs.set(ev.pointerId, svgPoint(ev)); fly = wheel = glide = null;
  if (ptrs.size === 2) {                                         // two fingers: pinch zoom
    const [a, b] = [...ptrs.values()];
    pinch = {d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, wx: ((a.x + b.x)/2 - state.x) / state.k, wy: ((a.y + b.y)/2 - state.y) / state.k, k0: state.k};
    drag = null; moved = true; return;
  }
  const p = ptrs.get(ev.pointerId);
  drag = {px: p.x, py: p.y, x: state.x, y: state.y, to: null, hist: [[performance.now(), state.x, state.y]]}; moved = false;
});
svg.addEventListener("pointermove", ev => {
  if (!ptrs.has(ev.pointerId)) return;
  const p = svgPoint(ev); ptrs.set(ev.pointerId, p);
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()], k = clampK(pinch.k0 * (Math.hypot(a.x - b.x, a.y - b.y) || 1) / pinch.d0);
    state.k = k; state.x = (a.x + b.x)/2 - pinch.wx*k; state.y = (a.y + b.y)/2 - pinch.wy*k; kick(); return;
  }
  if (!drag) return;
  const dx = p.x - drag.px, dy = p.y - drag.py;
  if (!moved && Math.hypot(dx, dy) > 14) { moved = true; svg.classList.add("dragging"); try { svg.setPointerCapture(ev.pointerId); } catch(e){} }
  if (moved) {
    const now = performance.now(); drag.to = [drag.x + dx, drag.y + dy]; drag.hist.push([now, drag.to[0], drag.to[1]]);
    while (drag.hist.length > 2 && now - drag.hist[0][0] > 100) drag.hist.shift();
    kick();
  }
});
function endPointer(ev){
  ptrs.delete(ev.pointerId);
  if (pinch) { if (ptrs.size < 2) { pinch = null; drag = null; setTimeout(() => { moved = false; }, 0); kick(); } return; }
  if (drag && moved && !REDUCE) {                                // carry on gliding after a flick
    const h = drag.hist, a = h[0], b = h[h.length - 1], dt = b[0] - a[0];
    if (dt > 0 && performance.now() - b[0] < 80) { const vx = (b[1] - a[1]) / dt, vy = (b[2] - a[2]) / dt; if (Math.hypot(vx, vy) > 0.2) glide = {vx, vy}; }
  }
  drag = null; svg.classList.remove("dragging"); setTimeout(() => { moved = false; }, 0); kick();
}
svg.addEventListener("pointerup", ev => { if (!moved && !pinch && ev.target === svg) { clearAll(); paint(); } endPointer(ev); });
svg.addEventListener("pointercancel", endPointer);
function zoomBy(f){ const [cx, cy] = centre(); flyTo(cx, cy, state.k * f, 360); }
$("zin").addEventListener("click", () => zoomBy(1.6));
$("zout").addEventListener("click", () => zoomBy(1/1.6));
$("reset").addEventListener("click", () => flyTo(CX, CY, 1));

/* ---------- controls ---------- */
DATA.directors.concat(DATA.directory).map(d => d.name).sort((a, b) => a.localeCompare(b)).forEach(n => { const o = document.createElement("option"); o.value = n; $("names").appendChild(o); });
const cats = {}; Object.keys(T).forEach(k => { (cats[T[k].cat] = cats[T[k].cat] || []).push(k); });
Object.keys(cats).forEach(c => { const g = document.createElement("optgroup"); g.label = c;
  cats[c].sort((a, b) => T[a].name.localeCompare(T[b].name)).forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = T[k].name; g.appendChild(o); }); $("tech").appendChild(g); });
$("tech").addEventListener("change", ev => { const t = ev.target.value; clearAll(); state.tech = t; paint(); });
Object.keys(DATA.regions).forEach(r => { const g = document.createElement("optgroup"); g.label = r;
  const all = document.createElement("option"); all.value = "r:" + r; all.textContent = "All of " + r + " (" + DATA.directors.filter(d => d.region === r).length + ")"; g.appendChild(all);
  DATA.regions[r].forEach(c => { const o = document.createElement("option"); o.value = "c:" + c; o.textContent = c + " (" + DATA.directors.filter(d => firstCountry(d) === c).length + ")"; g.appendChild(o); });
  $("geo").appendChild(g); });
$("geo").addEventListener("change", ev => { const g = ev.target.value; clearAll(); state.geo = g; paint(); });
$("viewbtn").addEventListener("click", () => { setView(state.view === "time" ? "map" : "time"); syncRoute(); });
if (DATA.crew.length) $("crewToggle").hidden = false;
$("showCrew").addEventListener("change", paint);
$("surprise").addEventListener("click", () => { const pool = DATA.directors.filter(d => d.id !== state.sel), d = pool[Math.floor(Math.random() * pool.length)]; select(d.id); centreOn(d, Math.max(state.k, 2.4)); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { clearAll(); paint(); } });
[["movement", "Movements"], ["category", "Critical categories"]].forEach(([kind, label]) => { const g = document.createElement("optgroup"); g.label = label;
  Object.keys(MV).filter(k => MV[k].kind === kind).sort((a, b) => MV[a].name.localeCompare(MV[b].name)).forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = MV[k].name + " (" + MV[k].members.length + ")"; g.appendChild(o); }); $("mov").appendChild(g); });
$("mov").addEventListener("change", ev => { state.mov = ""; if (ev.target.value) setMov(ev.target.value); else paint(); });
$("techclear").addEventListener("click", () => { state.tech = ""; paint(); });
$("showStyle").addEventListener("change", paint);
$("showInf").addEventListener("change", paint);
function find(){ const q = norm($("search").value.trim()); if (!q) return;
  const all = DATA.directors.concat(DATA.directory);
  const hit = all.find(d => norm(d.name) === q) || all.find(d => norm(d.name).includes(q));
  if (!hit) return;
  $("search").value = "";
  if (byId[hit.id]) { select(hit.id); centreOn(byId[hit.id], Math.max(state.k, 2.6)); }
  else { clearAll(); state.dir = hit.id; paint(); } }
$("search").addEventListener("change", find);
$("search").addEventListener("keydown", ev => { if (ev.key === "Enter") find(); });

render(); relabel(true);
followRoute(true);
</script>
