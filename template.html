<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auteur Atlas</title>
<link rel="icon" href="__FAVICON__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a dark reading room. The map fills the left, a reference panel sits right. One theme by choice. */
:root{
  color-scheme: dark;
  --bg:#121318; --surface:#1a1c23; --raised:#23262f; --line:#323644;
  --ink:#ece8df; --muted:#9d9ead; --accent:#e9b44c; --ok:#8fd19e;
  --era0:#b9c2cf; --era1:#e8926d; --era2:#9fd08c; --era3:#cba2e6; --era4:#7cc7e8;
  --in:#6fd3c7; --out:#e9b44c;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto;min-width:0}
.brand h1{margin:0;line-height:0}
.brand img{height:36px;width:auto;display:block}
.brand p{margin:0;color:var(--muted);font-size:13.5px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls input[type=search],.controls select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.controls input[type=search]{width:180px}
.controls select{max-width:185px}
.toggle{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);margin:0}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.btn:hover,.toggle:hover{border-color:var(--muted)}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px}
.stage{position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column}
svg#map{width:100%;flex:1;min-height:0;display:block;cursor:grab;touch-action:none}
svg#map.dragging{cursor:grabbing}
.techbar{position:absolute;left:12px;right:12px;top:12px;background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:8px 12px;display:flex;gap:12px;align-items:flex-start}
.techbar[hidden]{display:none}
.techbar p{margin:0;flex:1}
.legend{border-top:1px solid var(--line);background:var(--surface);padding:8px 64px 8px 16px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.legend b{color:var(--ink);font-weight:600}
.legend ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px}
.legend li{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.zoom{position:absolute;right:12px;bottom:64px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:36px;height:36px;padding:0;font-size:18px;line-height:1}

.node circle{stroke:var(--bg);stroke-width:2;transition:opacity .15s}
.node text{fill:var(--ink);font-size:var(--fs,13px);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:.3em;stroke-linejoin:round;pointer-events:none;transition:opacity .15s}
.node{cursor:pointer}
.node:hover circle{stroke:var(--ink)}
.node:hover text{display:block!important}
.node.sel circle{stroke:var(--ink);stroke-width:4}
.node.sel text{font-weight:600}
.node.dim circle{opacity:.3}
.node.dim text{opacity:.4}
svg.far .node.t2:not(.sel):not(.rel) text,svg.far .node.t3:not(.sel):not(.rel) text,svg.mid .node.t3:not(.sel):not(.rel) text{display:none}
.slink{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-opacity:.2}
.slink.hot{stroke:var(--ink);stroke-opacity:.85;stroke-width:2.4;stroke-dasharray:6 6}
.slink.dim{stroke-opacity:.04}
.ilink{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-opacity:.16}
.ilink.in{stroke:var(--in);stroke-opacity:.95;stroke-width:2.6}
.ilink.out{stroke:var(--out);stroke-opacity:.95;stroke-width:2.6}
.ilink.dim{stroke-opacity:.03}
.iarr{fill:var(--muted);fill-opacity:.16}
.iarr.in{fill:var(--in);fill-opacity:.95}
.iarr.out{fill:var(--out);fill-opacity:.95}
.iarr.dim{fill-opacity:.03}
.off{display:none}
.hull{cursor:pointer}
.hull path{fill:var(--accent);fill-opacity:.065;transition:fill-opacity .2s}
.hull.cat path{fill:var(--ink);fill-opacity:.04}
.hull text{fill:var(--accent);font-size:var(--hfs,13px);font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-anchor:middle;opacity:.85;paint-order:stroke;stroke:var(--bg);stroke-width:.35em;stroke-linejoin:round}
.hull.cat text{fill:var(--muted)}
svg.far .hull.small text{display:none}
.hull:hover path{fill-opacity:.12}
.hull.on path{fill-opacity:.17}
.hull.dim path{fill-opacity:.023}
.hull.cat.dim path{fill-opacity:.014}
.hull.dim text{opacity:.3}

aside{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:18px 18px 28px}
aside h2{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.12;margin:0 0 4px;text-wrap:balance}
aside .meta{color:var(--muted);margin:0 0 6px}
aside h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:22px 0 8px;display:flex;gap:8px;align-items:baseline}
aside h3 small{font-size:10.5px;letter-spacing:.04em;text-transform:none;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:0 7px}
aside h3 small.ok{color:var(--ok);border-color:var(--ok)}
aside ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank{margin:0 0 12px;color:var(--muted);font-size:13px}
.rank b{color:var(--accent);font-family:var(--display);font-size:18px;font-weight:800;margin-right:2px}
.rank a{color:var(--muted)}
.sig{font-size:15.5px;line-height:1.45;margin:0 0 8px;font-weight:500}
.desc{margin:0;color:var(--ink);opacity:.9}
aside ul.facts{gap:7px}
.facts li{position:relative;padding-left:15px}
.facts li::before{content:"";position:absolute;left:1px;top:.58em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.facts.ok li::before,.facts li.ok::before{background:var(--ok)}
aside ul.films{gap:8px}
.film{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
.film .ft{font-weight:600}
.film .fy{color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.film .bd{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.film .b{font-size:11.5px;border-radius:4px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.film .b.ts{color:var(--accent);border-color:var(--accent)}
.fg{margin:10px 0 4px}.fg summary{cursor:pointer;color:var(--muted);font-size:13px}.fg summary small{opacity:.8}
.fg ol{list-style:none;padding:0;margin:8px 0 0;columns:2;column-gap:18px;font-size:13px;line-height:1.5}
.fg li{break-inside:avoid}.fg .fy{display:inline-block;width:38px;color:var(--muted)}.fg a{color:var(--ink);text-decoration:none}.fg a:hover{color:var(--accent);text-decoration:underline}
.film .b.ca{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:600}
.film .b.ss{color:var(--in);border-color:var(--in)}
.film .ov{margin:7px 0 0;font-size:13px;color:var(--ink);opacity:.85}
.film .fl{display:flex;gap:12px;margin-top:7px;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--accent);color:var(--accent)}
.bar{display:grid;grid-template-columns:1fr;gap:3px;margin-bottom:9px}
.bar .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.bar .track{position:relative;height:6px;background:var(--raised);border-radius:3px}
.bar .pin{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.person{display:block;width:100%;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
.person:hover{border-color:var(--muted)}
.person b{font-weight:600}
.person small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.person small.ev{color:var(--ok)}
.tagin{color:var(--in)} .tagout{color:var(--out)}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.note{margin-top:22px;padding:10px 12px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:12.5px}
.src li{font-size:13px}
.src b{font-weight:600}
.src span{color:var(--muted)}

@media (max-width:900px){
  body{height:auto}
  main{display:block}
  .stage{height:70vh;min-height:380px}
  aside{border-left:0;border-top:1px solid var(--line)}
  .brand p{display:none}
}
.trace{fill:none;stroke:var(--accent);stroke-width:4.5;stroke-linecap:round;stroke-opacity:.95}
.trace.sty{stroke-dasharray:10 9}
.trace-h{fill:var(--accent)}
.node.end circle{stroke:var(--accent);stroke-width:4}
.trace-box{border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin:14px 0 6px;background:rgba(233,180,76,.06)}
.trace-box h3{margin-top:0}
.chain{list-style:none;padding:0;margin:0 0 10px}
.chain li{margin:0}
.chain .how{display:block;color:var(--muted);font-size:12.5px;margin:2px 0 2px 14px;padding-left:10px;border-left:2px solid var(--accent)}
.person.mini{padding:4px 8px}
.tracer{display:flex;gap:6px;flex-wrap:wrap}
.tracer input{flex:1 1 140px;min-width:0}
.awards{list-style:none;padding:0;margin:0}
.awards li{padding:5px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.awards small{color:var(--muted);flex-basis:100%}
.crole{margin:6px 0;line-height:1.5}
.crole>span{display:inline-block;min-width:118px;color:var(--muted);font-size:12.5px}
.crole a{color:var(--ink)}
small.wd{color:var(--ok)}
a.chip{text-decoration:none;color:var(--ink)}
@keyframes panelIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#panel.enter>*{animation:panelIn .22s ease-out both}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1><img src="__LOGO__" alt="Auteur Atlas"></h1>
    <p>Trace the influences that connect film directors.</p>
  </div>
  <div class="controls">
    <input type="search" id="search" list="names" placeholder="Find a director" aria-label="Find a director">
    <datalist id="names"></datalist>
    <select id="mov" aria-label="Highlight a movement"><option value="">Highlight a movement</option></select>
    <select id="tech" aria-label="Highlight a technique"><option value="">Highlight a technique</option></select>
    <select id="geo" aria-label="Highlight a region or country"><option value="">Highlight a region</option></select>
    <label class="toggle"><input type="checkbox" id="showStyle" checked> Style links</label>
    <label class="toggle"><input type="checkbox" id="showInf" checked> Influence</label>
    <button class="btn" id="reset" type="button">Whole map</button>
    <button class="btn" id="surprise" type="button" title="Jump to a random director">Surprise me</button>
  </div>
</header>
<main>
  <div class="stage">
    <svg id="map" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of film directors positioned by stylistic similarity">
      <g id="world"><g id="gHull"></g><g id="gStyle"></g><g id="gInf"></g><g id="gTrace"></g><g id="gNodes"></g></g>
    </svg>
    <div class="techbar" id="techbar" hidden><p id="techtext"></p><button class="btn" id="techclear" type="button">Clear</button></div>
    <div class="legend">
      <b>Closer together: more similar style.</b>
      <ul id="eras"></ul>
      <span>Colour: the median year of their films. Shaded areas: movements. Bigger circle: influenced more directors here. Arrows run from influence to influenced.</span>
    </div>
    <div class="zoom">
      <button class="btn" id="zin" type="button" aria-label="Zoom in">+</button>
      <button class="btn" id="zout" type="button" aria-label="Zoom out">&minus;</button>
    </div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script>
const DATA = __DATA__;
const NS = "http://www.w3.org/2000/svg";
const byId = {}; DATA.directors.forEach(d => byId[d.id] = d);
const dirById = {}; DATA.directory.forEach(d => dirById[d.id] = d);
const T = DATA.techniques, MV = DATA.movements;
const ERA = ["var(--era0)","var(--era1)","var(--era2)","var(--era3)","var(--era4)"];
const state = {sel: null, dir: "", tech: "", mov: "", geo: "", path: null, k: 1, x: 0, y: 0};
const clearAll = () => Object.assign(state, {sel: null, dir: "", tech: "", mov: "", geo: "", path: null});
const firstCountry = d => d.country.split("/")[0].trim();
const geoOk = d => !state.geo || (state.geo.startsWith("c:") ? firstCountry(d) === state.geo.slice(2) : d.region === state.geo.slice(2));
const $ = id => document.getElementById(id);
const svg = $("map"), world = $("world");
const CX = DATA.w/2, CY = DATA.h/2;
svg.setAttribute("viewBox", "0 0 " + DATA.w + " " + DATA.h);
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const a in attrs) e.setAttribute(a, attrs[a]); if (parent) parent.appendChild(e); return e; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
DATA.eras.forEach((lab, i) => { const li = document.createElement("li"); li.innerHTML = '<span class="dot" style="background:' + ERA[i] + '"></span>' + esc(lab); $("eras").appendChild(li); });

/* ---------- movement areas ---------- */
function hull(pts){
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (pts.length < 3) return pts;
  const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = []; for (const p of pts) { while (lo.length >= 2 && cross(lo[lo.length-2], lo[lo.length-1], p) <= 0) lo.pop(); lo.push(p); }
  const up = []; for (const p of pts.slice().reverse()) { while (up.length >= 2 && cross(up[up.length-2], up[up.length-1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
const hullEls = Object.keys(MV).filter(k => MV[k].primary.length >= 2).map(k => {
  const m = MV[k], pts = m.primary.map(id => [byId[id].x, byId[id].y]), h = hull(pts);
  const g = el("g", {class:"hull", tabindex:"0", role:"button", "aria-label":m.name}, $("gHull"));
  el("path", {d: roundedHull(h, 60)}, g);
  const top = Math.min.apply(null, pts.map(p => p[1])), cx = pts.reduce((a, p) => a + p[0], 0) / pts.length;
  const t = el("text", {x:cx, y:top - 70}, g); t.textContent = m.name;
  g.addEventListener("click", () => { if (!moved) setMov(k); });
  g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); setMov(k); } });
  return {k, e: g, small: m.primary.length < 5};
});
function roundedHull(h, r){
  /* the convex hull grown by r with round corners: straight edges plus arcs, drawn as a plain fill */
  const f = v => Math.round(v * 10) / 10;
  let A = 0; h.forEach((p, i) => { const q = h[(i + 1) % h.length]; A += p[0]*q[1] - q[0]*p[1]; });
  const s = A < 0 ? -1 : 1, sweep = A < 0 ? 0 : 1;
  const n = h.map((p, i) => { const q = h[(i + 1) % h.length], dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1; return [s*dy/L, -s*dx/L]; });
  let d = "M" + f(h[0][0] + r*n[0][0]) + "," + f(h[0][1] + r*n[0][1]);
  h.forEach((p, i) => { const j = (i + 1) % h.length, q = h[j];
    d += "L" + f(q[0] + r*n[i][0]) + "," + f(q[1] + r*n[i][1]) + "A" + r + "," + r + " 0 0," + sweep + " " + f(q[0] + r*n[j][0]) + "," + f(q[1] + r*n[j][1]); });
  return d + "Z";
}
function setMov(k){ const m = state.mov === k ? "" : k; clearAll(); state.mov = m; paint(); }

/* ---------- draw once ---------- */
/* links are drawn as a handful of combined paths, one per look, instead of one element per link: far cheaper to redraw while moving */
const f1 = v => Math.round(v * 10) / 10;
const sGeo = DATA.style.map(l => { const a = byId[l.a], b = byId[l.b]; return "M" + f1(a.x) + "," + f1(a.y) + "L" + f1(b.x) + "," + f1(b.y); });
function arrowHead(x, y, ux, uy, L){ const bx = x - ux*0.9*L, by = y - uy*0.9*L, h = 0.4*L;
  return "M" + f1(x + ux*0.1*L) + "," + f1(y + uy*0.1*L) + "L" + f1(bx - uy*h) + "," + f1(by + ux*h) + "L" + f1(bx + uy*h) + "," + f1(by - ux*h) + "Z"; }
const iGeo = DATA.influence.map(l => { const s = byId[l.s], t = byId[l.t];
  const dx = t.x - s.x, dy = t.y - s.y, d = Math.hypot(dx, dy) || 1, ux = dx/d, uy = dy/d;
  const x1 = s.x + ux*s.r, y1 = s.y + uy*s.r, x2 = t.x - ux*(t.r+4), y2 = t.y - uy*(t.r+4);
  const mx = (x1+x2)/2 - uy*d*0.08, my = (y1+y2)/2 + ux*d*0.08, ex = x2 - mx, ey = y2 - my, e = Math.hypot(ex, ey) || 1;
  return {c: "M" + f1(x1) + "," + f1(y1) + "Q" + f1(mx) + "," + f1(my) + " " + f1(x2) + "," + f1(y2), h9: arrowHead(x2, y2, ex/e, ey/e, 9), h13: arrowHead(x2, y2, ex/e, ey/e, 13)}; });
const SP = {}; [" dim", "", " hot"].forEach(c => SP[c] = el("path", {class: "slink" + c}, $("gStyle")));
const TR = {line: el("path", {class: "trace"}, $("gTrace")), dash: el("path", {class: "trace sty"}, $("gTrace")), head: el("path", {class: "trace-h"}, $("gTrace"))};
const IP = {}; [" dim", "", " in", " out"].forEach(c => IP[c] = [el("path", {class: "ilink" + c}, $("gInf")), el("path", {class: "iarr" + c}, $("gInf"))]);
const nodeEls = DATA.directors.map(d => {
  const g = el("g", {class:"node", tabindex:"0", role:"button", "aria-label":d.name}, $("gNodes"));
  el("circle", {cx:d.x, cy:d.y, r:d.r, fill:ERA[d.era]}, g);
  const t = el("text", {x:d.x, y:d.y + d.r, dy:"1.15em"}, g); t.textContent = d.name; d.label = t;
  g.addEventListener("click", () => { if (!moved) select(d.id); });
  g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(d.id); } });
  return {d, e: g};
});

/* ---------- state to view ---------- */
function related(id){
  const s = new Set([id]);
  DATA.style.forEach(l => { if (l.a === id) s.add(l.b); if (l.b === id) s.add(l.a); });
  DATA.influence.forEach(l => { if (l.s === id) s.add(l.t); if (l.t === id) s.add(l.s); });
  byId[id].near.forEach(n => s.add(n.id));
  return s;
}
function paint(){
  const showS = $("showStyle").checked, showI = $("showInf").checked;
  const onPath = state.path && !state.path.none ? new Set([state.path.a].concat(state.path.steps.map(s => s.to))) : null;
  const rel = state.sel && !onPath ? related(state.sel) : null;
  const active = state.tech || state.mov || state.geo || onPath || rel;
  nodeEls.forEach(({d, e}) => {
    let dim = false;
    if (state.tech) dim = !d.tags.includes(state.tech);
    else if (state.mov) dim = !d.movements.includes(state.mov);
    else if (state.geo) dim = !geoOk(d);
    else if (onPath) dim = !onPath.has(d.id);
    else if (rel) dim = !rel.has(d.id);
    e.setAttribute("class", "node t" + d.tier + (d.id === state.sel ? " sel" : "") + (state.path && d.id === state.path.b ? " end" : "") + (dim ? " dim" : active ? " rel" : ""));
  });
  const sb = {" dim": [], "": [], " hot": []};
  if (showS) DATA.style.forEach((l, i) => { let c = "";

  const r = decodeURIComponent(location.hash.replace(/^#/, "")); let m;
  clearAll();
  if ((m = r.match(/^path\/([^/]+)\/([^/]+)$/)) && byId[m[1]] && byId[m[2]]) { setPath(m[1], m[2], false); return "path"; }
  if ((m = r.match(/^m\/(.+)$/)) && MV[m[1]]) state.mov = m[1];
  else if ((m = r.match(/^t\/(.+)$/)) && T[m[1]]) state.tech = m[1];
  else if ((m = r.match(/^g\/([rc]:.+)$/))) state.geo = m[1];
  else if ((m = r.match(/^x\/(.+)$/)) && dirById[m[1]]) state.dir = m[1];
  else if (byId[r]) { state.sel = r; return r; }
  return null;
}
function followRoute(first){
  routing = true; const id = applyRoute(); paint(); routing = false;
  const go = () => { if (id === "path") fitPath(); else if (id) centreOn(byId[id], Math.max(state.k, 2.4)); };
  if (first) setTimeout(go, 300); else go();
}
window.addEventListener("popstate", () => followRoute(false));

/* ---------- pan and zoom ----------
   One animation loop drives every movement. Wheel and trackpad zoom ease towards a target
   in proportion to how far the wheel turned; dragging follows the pointer frame by frame and
   glides on when released; selecting, searching and the buttons fly along a zoom-out-and-in
   path. Label sizes are only reset when the view settles, so text is not re-laid out every frame. */
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const KMIN = 0.8, KMAX = 14;
let box = svg.getBoundingClientRect(), fsNow = 0, modeNow = null;
function render(){ world.setAttribute("transform", "translate(" + state.x.toFixed(2) + "," + state.y.toFixed(2) + ") scale(" + state.k.toFixed(5) + ")"); relabel(false); }
function apply(){ render(); relabel(true); }
function relabel(exact){
  if (!box.width) return;
  const sc = Math.min(box.width / DATA.w, box.height / DATA.h) * state.k, fs = 11.5 / sc;
  if (exact || !fsNow || Math.abs(Math.log(fs / fsNow)) > 0.08) { fsNow = fs; world.style.setProperty("--fs", fs + "px"); world.style.setProperty("--hfs", (11 / sc) + "px"); }
  const mode = sc < 0.42 ? "far" : sc < 0.8 ? "mid" : "near";
  if (mode !== modeNow) { modeNow = mode; svg.classList.toggle("far", mode === "far"); svg.classList.toggle("mid", mode === "mid"); }
}
new ResizeObserver(() => { box = svg.getBoundingClientRect(); relabel(true); }).observe(svg);
const clampK = k => Math.min(KMAX, Math.max(KMIN, k));
const centre = () => [(CX - state.x) / state.k, (CY - state.y) / state.k];

/* smooth zoom-and-pan path (van Wijk and Nuij, as in d3.interpolateZoom); a view is [centre x, centre y, width] */
function zoomPath(p0, p1){
  const rho = Math.SQRT2, cosh = x => (Math.exp(x) + Math.exp(-x)) / 2, sinh = x => (Math.exp(x) - Math.exp(-x)) / 2, tanh = x => sinh(x) / cosh(x);
  const [ux0, uy0, w0] = p0, [ux1, uy1, w1] = p1, dx = ux1 - ux0, dy = uy1 - uy0, d2 = dx*dx + dy*dy;
  let path, S;
  if (d2 < 1e-6) { S = Math.log(w1 / w0) / rho; path = t => [ux0 + t*dx, uy0 + t*dy, w0 * Math.exp(rho * t * S)]; }
  else {
    const d1 = Math.sqrt(d2), b0 = (w1*w1 - w0*w0 + 4*d2) / (2*w0*2*d1), b1 = (w1*w1 - w0*w0 - 4*d2) / (2*w1*2*d1);
    const r0 = Math.log(Math.sqrt(b0*b0 + 1) - b0), r1 = Math.log(Math.sqrt(b1*b1 + 1) - b1);
    S = (r1 - r0) / rho;
    path = t => { const s = t * S, u = w0 / (2*d1) * (cosh(r0) * tanh(rho*s + r0) - sinh(r0)); return [ux0 + u*dx, uy0 + u*dy, w0 * cosh(r0) / cosh(rho*s + r0)]; };
  }
  path.duration = Math.abs(S) * 1000;
  return path;
}

let raf = 0, last = 0, fly = null, wheel = null, glide = null, settle = 0;
function kick(){ if (!raf) raf = requestAnimationFrame(tick); }
function tick(now){
  raf = 0; const dt = last ? Math.min(50, now - last) : 16; last = now; let busy = false;
  if (fly) {
    const t = Math.min(1, (now - fly.t0) / fly.dur), e = t < .5 ? 4*t*t*t : 1 - Math.pow(2 - 2*t, 3) / 2, v = fly.path(e);
    state.k = DATA.w / v[2]; state.x = CX - v[0]*state.k; state.y = CY - v[1]*state.k;
    if (t < 1) busy = true; else fly = null;
  }
  if (wheel) {
    const k = state.k * Math.pow(wheel.k / state.k, 1 - Math.exp(-dt / 70)), r = k / state.k;
    state.x = wheel.px - (wheel.px - state.x)*r; state.y = wheel.py - (wheel.py - state.y)*r; state.k = k;
    if (Math.abs(Math.log(wheel.k / k)) > 0.001) busy = true; else wheel = null;
  }
  if (glide) {
    const f = Math.exp(-dt / 300); glide.vx *= f; glide.vy *= f; state.x += glide.vx*dt; state.y += glide.vy*dt;
    if (Math.hypot(glide.vx, glide.vy) > 0.02) busy = true; else glide = null;
  }
  if (drag && drag.to) { state.x = drag.to[0]; state.y = drag.to[1]; drag.to = null; }
  render();
  if (busy) kick();
  else { last = 0; clearTimeout(settle); settle = setTimeout(() => relabel(true), 80); }
}
function flyTo(cx, cy, k, ms){
  k = clampK(k); wheel = glide = null;
  if (REDUCE) { state.k = k; state.x = CX - cx*k; state.y = CY - cy*k; render(); relabel(true); return; }
  const [x0, y0] = centre(), path = zoomPath([x0, y0, DATA.w / state.k], [cx, cy, DATA.w / k]);
  fly = {path, t0: performance.now(), dur: ms || Math.max(420, Math.min(1200, path.duration * 0.9))};
  last = 0; kick();
}
function centreOn(d, k){ flyTo(d.x, d.y, k == null ? state.k : k); }
function zoomAt(px, py, f){ const k = clampK(state.k*f), r = k/state.k; state.x = px - (px - state.x)*r; state.y = py - (py - state.y)*r; state.k = k; render(); relabel(true); }
function svgPoint(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }

svg.addEventListener("wheel", ev => {
  ev.preventDefault(); fly = glide = null;
  const p = svgPoint(ev), dy = ev.deltaY * (ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? 400 : 1);
  const f = Math.exp(-dy * (ev.ctrlKey ? 0.01 : 0.0022));        // ctrlKey: pinch on a trackpad
  wheel = {k: clampK((wheel ? wheel.k : state.k) * f), px: p.x, py: p.y};
  if (REDUCE) { zoomAt(p.x, p.y, wheel.k / state.k); wheel = null; return; }
  kick();
}, {passive: false});

let drag = null, moved = false, pinch = null;
const ptrs = new Map();
svg.addEventListener("pointerdown", ev => {
  ptrs.set(ev.pointerId, svgPoint(ev)); fly = wheel = glide = null;
  if (ptrs.size === 2) {                                         // two fingers: pinch zoom
    const [a, b] = [...ptrs.values()];
    pinch = {d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, wx: ((a.x + b.x)/2 - state.x) / state.k, wy: ((a.y + b.y)/2 - state.y) / state.k, k0: state.k};
    drag = null; moved = true; return;
  }
  const p = ptrs.get(ev.pointerId);
  drag = {px: p.x, py: p.y, x: state.x, y: state.y, to: null, hist: [[performance.now(), state.x, state.y]]}; moved = false;
});
svg.addEventListener("pointermove", ev => {
  if (!ptrs.has(ev.pointerId)) return;
  const p = svgPoint(ev); ptrs.set(ev.pointerId, p);
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()], k = clampK(pinch.k0 * (Math.hypot(a.x - b.x, a.y - b.y) || 1) / pinch.d0);
    state.k = k; state.x = (a.x + b.x)/2 - pinch.wx*k; state.y = (a.y + b.y)/2 - pinch.wy*k; kick(); return;
  }
  if (!drag) return;
  const dx = p.x - drag.px, dy = p.y - drag.py;
  if (!moved && Math.hypot(dx, dy) > 14) { moved = true; svg.classList.add("dragging"); try { svg.setPointerCapture(ev.pointerId); } catch(e){} }
  if (moved) {
    const now = performance.now(); drag.to = [drag.x + dx, drag.y + dy]; drag.hist.push([now, drag.to[0], drag.to[1]]);
    while (drag.hist.length > 2 && now - drag.hist[0][0] > 100) drag.hist.shift();
    kick();
  }
});
function endPointer(ev){
  ptrs.delete(ev.pointerId);
  if (pinch) { if (ptrs.size < 2) { pinch = null; drag = null; setTimeout(() => { moved = false; }, 0); kick(); } return; }
  if (drag && moved && !REDUCE) {                                // carry on gliding after a flick
    const h = drag.hist, a = h[0], b = h[h.length - 1], dt = b[0] - a[0];
    if (dt > 0 && performance.now() - b[0] < 80) { const vx = (b[1] - a[1]) / dt, vy = (b[2] - a[2]) / dt; if (Math.hypot(vx, vy) > 0.2) glide = {vx, vy}; }
  }
  drag = null; svg.classList.remove("dragging"); setTimeout(() => { moved = false; }, 0); kick();
}
svg.addEventListener("pointerup", ev => { if (!moved && !pinch && ev.target === svg) { clearAll(); paint(); } endPointer(ev); });
svg.addEventListener("pointercancel", endPointer);
function zoomBy(f){ const [cx, cy] = centre(); flyTo(cx, cy, state.k * f, 360); }
$("zin").addEventListener("click", () => zoomBy(1.6));
$("zout").addEventListener("click", () => zoomBy(1/1.6));
$("reset").addEventListener("click", () => flyTo(CX, CY, 1));

/* ---------- controls ---------- */
DATA.directors.concat(DATA.directory).map(d => d.name).sort((a, b) => a.localeCompare(b)).forEach(n => { const o = document.createElement("option"); o.value = n; $("names").appendChild(o); });
const cats = {}; Object.keys(T).forEach(k => { (cats[T[k].cat] = cats[T[k].cat] || []).push(k); });
Object.keys(cats).forEach(c => { const g = document.createElement("optgroup"); g.label = c;
  cats[c].sort((a, b) => T[a].name.localeCompare(T[b].name)).forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = T[k].name; g.appendChild(o); }); $("tech").appendChild(g); });
$("tech").addEventListener("change", ev => { const t = ev.target.value; clearAll(); state.tech = t; paint(); });
Object.keys(DATA.regions).forEach(r => { const g = document.createElement("optgroup"); g.label = r;
  const all = document.createElement("option"); all.value = "r:" + r; all.textContent = "All of " + r + " (" + DATA.directors.filter(d => d.region === r).length + ")"; g.appendChild(all);
  DATA.regions[r].forEach(c => { const o = document.createElement("option"); o.value = "c:" + c; o.textContent = c + " (" + DATA.directors.filter(d => firstCountry(d) === c).length + ")"; g.appendChild(o); });
  $("geo").appendChild(g); });
$("geo").addEventListener("change", ev => { const g = ev.target.value; clearAll(); state.geo = g; paint(); });
$("surprise").addEventListener("click", () => { const pool = DATA.directors.filter(d => d.id !== state.sel), d = pool[Math.floor(Math.random() * pool.length)]; select(d.id); centreOn(d, Math.max(state.k, 2.4)); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { clearAll(); paint(); } });
[["movement", "Movements"], ["category", "Critical categories"]].forEach(([kind, label]) => { const g = document.createElement("optgroup"); g.label = label;
  Object.keys(MV).filter(k => MV[k].kind === kind).sort((a, b) => MV[a].name.localeCompare(MV[b].name)).forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = MV[k].name + " (" + MV[k].members.length + ")"; g.appendChild(o); }); $("mov").appendChild(g); });
$("mov").addEventListener("change", ev => { state.mov = ""; if (ev.target.value) setMov(ev.target.value); else paint(); });
$("techclear").addEventListener("click", () => { state.tech = ""; paint(); });
$("showStyle").addEventListener("change", paint);
$("showInf").addEventListener("change", paint);
function find(){ const q = norm($("search").value.trim()); if (!q) return;
  const all = DATA.directors.concat(DATA.directory);
  const hit = all.find(d => norm(d.name) === q) || all.find(d => norm(d.name).includes(q));
  if (!hit) return;
  $("search").value = "";
  if (byId[hit.id]) { select(hit.id); centreOn(byId[hit.id], Math.max(state.k, 2.6)); }
  else { clearAll(); state.dir = hit.id; paint(); } }
$("search").addEventListener("change", find);
$("search").addEventListener("keydown", ev => { if (ev.key === "Enter") find(); });

render(); relabel(true);
followRoute(true);
</script>
</body>
</html>
