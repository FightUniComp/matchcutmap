<style>
/* Layout idea: a dark reading room. The map fills the left, a reference panel sits right. One theme by choice. */
:root{
  color-scheme: dark;
  --bg:#121318; --surface:#1a1c23; --raised:#23262f; --line:#323644;
  --ink:#ece8df; --muted:#9d9ead; --accent:#e9b44c; --ok:#8fd19e;
  --era0:#b9c2cf; --era1:#e8926d; --era2:#9fd08c; --era3:#cba2e6; --era4:#7cc7e8;
  --in:#6fd3c7; --out:#e9b44c;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto;min-width:0}
.brand h1{margin:0;line-height:0}
.brand img{height:36px;width:auto;display:block}
.brand p{margin:0;color:var(--muted);font-size:13.5px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls input[type=search],.controls select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.controls input[type=search]{width:180px}
.controls select{max-width:185px}
.toggle{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);margin:0}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.btn:hover,.toggle:hover{border-color:var(--muted)}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px}
.stage{position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column}
svg#map{width:100%;flex:1;min-height:0;display:block;cursor:grab;touch-action:none}
svg#map.dragging{cursor:grabbing}
.techbar{position:absolute;left:12px;right:12px;top:12px;background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:8px 12px;display:flex;gap:12px;align-items:flex-start}
.techbar[hidden]{display:none}
.techbar p{margin:0;flex:1}
.legend{border-top:1px solid var(--line);background:var(--surface);padding:8px 64px 8px 16px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.legend b{color:var(--ink);font-weight:600}
.legend ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px}
.legend li{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.zoom{position:absolute;right:12px;bottom:64px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:36px;height:36px;padding:0;font-size:18px;line-height:1}

.node circle{stroke:var(--bg);stroke-width:2;transition:opacity .15s}
.node text{fill:var(--ink);font-size:var(--fs,13px);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:.3em;stroke-linejoin:round;pointer-events:none;transition:opacity .15s}
.node{cursor:pointer}
.node:hover circle{stroke:var(--ink)}
.node:hover text{display:block!important}
.node.sel circle{stroke:var(--ink);stroke-width:4}
.node.sel text{font-weight:600}
.node.dim circle{opacity:.3}
.node.dim text{opacity:.4}
svg.far .node.t2:not(.sel):not(.rel) text,svg.far .node.t3:not(.sel):not(.rel) text,svg.mid .node.t3:not(.sel):not(.rel) text{display:none}
.slink{stroke:var(--muted);stroke-width:1.4;opacity:.2}
.slink.hot{stroke:var(--ink);opacity:.85;stroke-width:2.4;stroke-dasharray:6 6}
.slink.dim{opacity:.04}
.ilink{stroke:var(--muted);stroke-width:1.5;opacity:.16;fill:none}
.ilink.in{stroke:var(--in);opacity:.95;stroke-width:2.6}
.ilink.out{stroke:var(--out);opacity:.95;stroke-width:2.6}
.ilink.dim{opacity:.03}
.off{display:none}
.hull{cursor:pointer}
.hull path{fill:var(--accent);stroke:var(--accent);stroke-width:120;stroke-linejoin:round;stroke-linecap:round;opacity:.065;transition:opacity .15s}
.hull.cat path{fill:var(--ink);stroke:var(--ink);opacity:.04}
.hull text{fill:var(--accent);font-size:var(--hfs,13px);font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-anchor:middle;opacity:.85;paint-order:stroke;stroke:var(--bg);stroke-width:.35em;stroke-linejoin:round}
.hull.cat text{fill:var(--muted)}
svg.far .hull.small text{display:none}
.hull:hover path{opacity:.12}
.hull.on path{opacity:.17}
.hull.dim{opacity:.35}

aside{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:18px 18px 28px}
aside h2{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.12;margin:0 0 4px;text-wrap:balance}
aside .meta{color:var(--muted);margin:0 0 6px}
aside h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:22px 0 8px;display:flex;gap:8px;align-items:baseline}
aside h3 small{font-size:10.5px;letter-spacing:.04em;text-transform:none;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:0 7px}
aside h3 small.ok{color:var(--ok);border-color:var(--ok)}
aside ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank{margin:0 0 12px;color:var(--muted);font-size:13px}
.rank b{color:var(--accent);font-family:var(--display);font-size:18px;font-weight:800;margin-right:2px}
.rank a{color:var(--muted)}
.sig{font-size:15.5px;line-height:1.45;margin:0 0 8px;font-weight:500}
.desc{margin:0;color:var(--ink);opacity:.9}
aside ul.facts{gap:7px}
.facts li{position:relative;padding-left:15px}
.facts li::before{content:"";position:absolute;left:1px;top:.58em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.facts.ok li::before,.facts li.ok::before{background:var(--ok)}
aside ul.films{gap:8px}
.film{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
.film .ft{font-weight:600}
.film .fy{color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.film .bd{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.film .b{font-size:11.5px;border-radius:4px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.film .b.ts{color:var(--accent);border-color:var(--accent)}
.film .b.ca{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:600}
.film .b.ss{color:var(--in);border-color:var(--in)}
.film .ov{margin:7px 0 0;font-size:13px;color:var(--ink);opacity:.85}
.film .fl{display:flex;gap:12px;margin-top:7px;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--accent);color:var(--accent)}
.bar{display:grid;grid-template-columns:1fr;gap:3px;margin-bottom:9px}
.bar .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.bar .track{position:relative;height:6px;background:var(--raised);border-radius:3px}
.bar .pin{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.person{display:block;width:100%;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
.person:hover{border-color:var(--muted)}
.person b{font-weight:600}
.person small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.person small.ev{color:var(--ok)}
.tagin{color:var(--in)} .tagout{color:var(--out)}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.note{margin-top:22px;padding:10px 12px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:12.5px}
.src li{font-size:13px}
.src b{font-weight:600}
.src span{color:var(--muted)}

@media (max-width:900px){
  body{height:auto}
  main{display:block}
  .stage{height:70vh;min-height:380px}
  aside{border-left:0;border-top:1px solid var(--line)}
  .brand p{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

function hull(pts){
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (pts.length < 3) return pts;
  const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = []; for (const p of pts) { while (lo.length >= 2 && cross(lo[lo.length-2], lo[lo.length-1], p) <= 0) lo.pop(); lo.push(p); }
  const up = []; for (const p of pts.slice().reverse()) { while (up.length >= 2 && cross(up[up.length-2], up[up.length-1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
const hullEls = Object.keys(MV).filter(k => MV[k].primary.length >= 2).map(k => {
  const m = MV[k], pts = m.primary.map(id => [byId[id].x, byId[id].y]), h = hull(pts);
  const g = el("g", {class:"hull", tabindex:"0", role:"button", "aria-label":m.name}, $("gHull"));
  el("path", {d:"M" + h.map(p => p.join(",")).join("L") + "Z"}, g);
  const top = Math.min.apply(null, pts.map(p => p[1])), cx = pts.reduce((a, p) => a + p[0], 0) / pts.length;
  const t = el("text", {x:cx, y:top - 70}, g); t.textContent = m.name;
  g.addEventListener("click", () => { if (!moved) setMov(k); });
  g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); setMov(k); } });

function related(id){

  DATA.influence.forEach(l => { if (l.s === id) s.add(l.t); if (l.t === id) s.add(l.s); });
  byId[id].near.forEach(n => s.add(n.id));

}

    else if (state.mov) c += (byId[l.a].movements.includes(state.mov) && byId[l.b].movements.includes(state.mov)) ? "" : " dim";

    else if (state.sel) { if (l.t === state.sel) { c += " in"; m = "arrIn"; } else if (l.s === state.sel) { c += " out"; m = "arrOut"; } else c += " dim"; }
    e.setAttribute("class", c); e.setAttribute("marker-end", "url(#" + m + ")");
  });

}

    (d.movements.length ? '<h3>Movements</h3><div class="chips">' + d.movements.map(m => '<button class="chip" type="button" data-mov="' + m + '" title="' + esc(MV[m].desc) + '">' + esc(MV[m].name) + '</button>').join("") + '</div>' : '') +
    (d.lists.length ? '<h3>On the lists <small class="ok">from the sources</small></h3><ul class="facts ok">' + d.lists.map(f => '<li>' + esc(f) + '</li>').join("") + '</ul>' : '') +
    (d.films.length ? '<h3>Key films' + (d.nfilms > d.films.length ? ' <small>' + d.films.length + ' of ' + d.nfilms + '</small>' : '') + '</h3><ul class="films">' + d.films.map(filmItem).join("") + '</ul>' : '') +
    (d.facts.length ? '<h3>Worth knowing <small' + (d.facts.every(f => f[1]) ? ' class="ok">checked' : '>' + (d.facts.some(f => f[1]) ? d.facts.filter(f => f[1]).length + ' of ' + d.facts.length + ' checked' : 'draft')) + '</small></h3><ul class="facts">' + d.facts.map(f => '<li' + (f[1] ? ' class="ok" title="Checked against a source"' : '') + '>' + esc(f[0]) + '</li>').join("") + '</ul>' : '') +
    '<h3>Techniques <small>draft</small></h3><div class="chips">' + chips + '</div>' +
    '<h3>Style profile <small>draft</small></h3>' + bars +
    '<h3>Closest in style</h3><ul>' + near + '</ul>' +
    (inn.length ? '<h3>Influenced by (' + inn.length + ')</h3><ul>' + inn.map(l => person(l.s, l.note, "tagin", l.ev)).join("") + '</ul>' : '') +
    (out.length ? '<h3>Influenced (' + out.length + ')</h3><ul>' + out.map(l => person(l.t, l.note, "tagout", l.ev)).join("") + '</ul>' : '') +
    lookups(d.name) + draft();
  bind(p); p.scrollTop = 0;
}
function bind(p){
  p.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => select(b.dataset.go, true)));
  p.querySelectorAll("[data-mov]").forEach(b => b.addEventListener("click", () => setMov(b.dataset.mov)));
  p.querySelectorAll("[data-tech]").forEach(b => b.addEventListener("click", () => { state.tech = state.tech === b.dataset.tech ? "" : b.dataset.tech; state.mov = ""; paint(); }));
}
function select(id, centre){ state.sel = id; state.dir = ""; state.tech = ""; state.mov = ""; if (centre) centreOn(byId[id]); paint(); }

/* ---------- pan and zoom ---------- */
function apply(){ world.setAttribute("transform", "translate(" + state.x + "," + state.y + ") scale(" + state.k + ")"); relabel(); }
function relabel(){
  const b = svg.getBoundingClientRect(); if (!b.width) return;
  const sc = Math.min(b.width / DATA.w, b.height / DATA.h) * state.k, fs = 11.5 / sc;
  world.style.setProperty("--fs", fs + "px"); world.style.setProperty("--hfs", (11 / sc) + "px");
  svg.classList.toggle("far", sc < 0.42); svg.classList.toggle("mid", sc >= 0.42 && sc < 0.8);
  DATA.directors.forEach(d => d.label.setAttribute("y", d.y + d.r + fs * 1.15));
}
window.addEventListener("resize", relabel);
function centreOn(d){ state.x = CX - d.x*state.k; state.y = CY - d.y*state.k; apply(); }
function svgPoint(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
function zoomAt(px, py, f){ const k = Math.min(14, Math.max(0.8, state.k*f)); const r = k/state.k; state.x = px - (px - state.x)*r; state.y = py - (py - state.y)*r; state.k = k; apply(); }
svg.addEventListener("wheel", ev => { ev.preventDefault(); const p = svgPoint(ev); zoomAt(p.x, p.y, ev.deltaY < 0 ? 1.15 : 1/1.15); }, {passive:false});
let drag = null, moved = false;
svg.addEventListener("pointerdown", ev => { const p = svgPoint(ev); drag = {px:p.x, py:p.y, x:state.x, y:state.y}; moved = false; });
svg.addEventListener("pointermove", ev => { if (!drag) return; const p = svgPoint(ev); const dx = p.x - drag.px, dy = p.y - drag.py;
  if (!moved && Math.hypot(dx, dy) > 14) { moved = true; svg.classList.add("dragging"); try { svg.setPointerCapture(ev.pointerId); } catch(e){} }
  if (moved) { state.x = drag.x + dx; state.y = drag.y + dy; apply(); } });
function endDrag(){ drag = null; svg.classList.remove("dragging"); setTimeout(() => { moved = false; }, 0); }
svg.addEventListener("pointerup", ev => { if (!moved && ev.target === svg) { state.sel = null; state.dir = ""; state.tech = ""; state.mov = ""; paint(); } endDrag(); });
svg.addEventListener("pointercancel", endDrag);
$("zin").addEventListener("click", () => zoomAt(CX, CY, 1.4));
$("zout").addEventListener("click", () => zoomAt(CX, CY, 1/1.4));
$("reset").addEventListener("click", () => { state.k = 1; state.x = 0; state.y = 0; apply(); });

/* ---------- controls ---------- */
DATA.directors.concat(DATA.directory).map(d => d.name).sort((a, b) => a.localeCompare(b)).forEach(n => { const o = document.createElement("option"); o.value = n; $("names").appendChild(o); });
const cats = {}; Object.keys(T).forEach(k => { (cats[T[k].cat] = cats[T[k].cat] || []).push(k); });
Object.keys(cats).forEach(c => { const g = document.createElement("optgroup"); g.label = c;
  cats[c].sort((a, b) => T[a].name.localeCompare(T[b].name)).forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = T[k].name; g.appendChild(o); }); $("tech").appendChild(g); });
$("tech").addEventListener("change", ev => { state.tech = ev.target.value; state.mov = ""; paint(); });
[["movement", "Movements"], ["category", "Critical categories"]].forEach(([kind, label]) => { const g = document.createElement("optgroup"); g.label = label;
  Object.keys(MV).filter(k => MV[k].kind === kind).sort((a, b) => MV[a].name.localeCompare(MV[b].name)).forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = MV[k].name + " (" + MV[k].members.length + ")"; g.appendChild(o); }); $("mov").appendChild(g); });
$("mov").addEventListener("change", ev => { state.mov = ""; if (ev.target.value) setMov(ev.target.value); else paint(); });
$("techclear").addEventListener("click", () => { state.tech = ""; paint(); });
$("showStyle").addEventListener("change", paint);
$("showInf").addEventListener("change", paint);
function find(){ const q = norm($("search").value.trim()); if (!q) return;
  const all = DATA.directors.concat(DATA.directory);
  const hit = all.find(d => norm(d.name) === q) || all.find(d => norm(d.name).includes(q));
  if (!hit) return;
  $("search").value = "";
  if (byId[hit.id]) { if (state.k < 2.6) state.k = 2.6; select(hit.id, true); }
  else { state.dir = hit.id; state.sel = null; state.tech = ""; state.mov = ""; paint(); } }
$("search").addEventListener("change", find);
$("search").addEventListener("keydown", ev => { if (ev.key === "Enter") find(); });

state.k = 2.6; if (state.sel) centreOn(byId[state.sel]); else apply();
paint();
</script>
